name: Deploy to Cloudflare Pages

on: [push]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      
      # I don't know if we can have both installed at the same time, but this is simpler: first, rust-toolchain with nightly, then the stable (last is default). This should allow to have both installed, although unoptimal.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust -> target"

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: true
          cache: npm
          cache-dependency-path: www/package-lock.json

      - name: Install and build
        working-directory: www
        env:
          NODE_OPTIONS: "--max_old_space_size=8192"
        run: |
          python3 ../scripts/build_wasm64.py --crate rust/ska.rust --module ska
          npm ci
          npm run build
          find dist/ -name '*.map' -delete  # Remove source maps, which are very large

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy www/dist --project-name=sparrowhawk
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
