[package]
name = "esm-bridge"
version = "0.1.0"
edition = "2021"
description = "In-browser ESM2 protein embeddings (burn + burn-onnx)"
license = "GPL-3.0-or-later"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
burn = { version = "0.21", default-features = false, features = ["std", "ndarray", "webgpu", "cubecl"] }
burn-store = { version = "0.21", default-features = false, features = ["burnpack"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3.77", features = ["console"] }
console_error_panic_hook = "0.1.7"
getrandom = { version = "0.4", features = ["wasm_js"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
burn = { version = "0.21", default-features = false, features = ["autodiff"] }
burn-store = { version = "0.21", features = ["std"] }
pollster = "0.4"

[build-dependencies]
burn-onnx = "0.21"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
